<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1270" width="1100" height="1270" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" role="img" aria-label="Flow diagram of the tool selection rules"><rect width="1100" height="1270" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f94"/></marker></defs>
<text x="30" y="34" font-size="21" font-family="Georgia,serif" fill="#1d2328">How tools were selected: first selection (C1 for every tool)</text>
<text x="30" y="55" font-size="12" fill="#5d666d">As applied (search frozen 2026-10-22). Orange outline: the criterion depends on Google source counts. Counts are from the paper's funnel table.</text>
<rect x="30" y="80" width="330" height="87" rx="9" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.4"/>
<text x="42" y="101" font-size="13" font-weight="700" fill="#1d2328">1 · GitHub search (open source)</text>
<text x="42" y="120" font-size="11.5" fill="#1d2328">10 topic and 7 keyword queries, sorted by stars</text>
<text x="42" y="135" font-size="11.5" fill="#1d2328">I2 in the query: at least 1,000 stars, not archived,</text>
<text x="42" y="150" font-size="11.5" fill="#1d2328">a push in the last 6 months</text>
<rect x="385" y="80" width="330" height="87" rx="9" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.4"/>
<text x="397" y="101" font-size="13" font-weight="700" fill="#1d2328">2 · Google search (open and closed source)</text>
<text x="397" y="120" font-size="11.5" fill="#1d2328">6 queries, first 30 results each (173 results)</text>
<text x="397" y="135" font-size="11.5" fill="#1d2328">titles and snippets only, one day, signed out</text>
<text x="397" y="150" font-size="11.5" fill="#1d2328">records every tool named (68 tools)</text>
<rect x="740" y="80" width="330" height="72" rx="9" fill="#e8f1f5" stroke="#1f6f8b" stroke-width="1.4"/>
<text x="752" y="101" font-size="13" font-weight="700" fill="#1d2328">3 · Standards</text>
<text x="752" y="120" font-size="11.5" fill="#1d2328">OpenTelemetry GenAI conventions as the</text>
<text x="752" y="135" font-size="11.5" fill="#1d2328">vendor-neutral reference (also named by Google)</text>
<rect x="30" y="200" width="330" height="117" rx="9" fill="#ffffff" stroke="#5d666d" stroke-width="1.4"/>
<text x="42" y="221" font-size="13" font-weight="700" fill="#1d2328">Manual check of the 182 repositories</text>
<text x="42" y="240" font-size="11.5" fill="#1d2328">I1: primary purpose is tracing, monitoring or</text>
<text x="42" y="255" font-size="11.5" fill="#1d2328">evaluating LLM applications or agents</text>
<text x="42" y="270" font-size="11.5" fill="#1d2328">not E1 gateway, E2 agent framework,</text>
<text x="42" y="285" font-size="11.5" fill="#1d2328">E3 model benchmark harness, E4 tutorial or list</text>
<text x="42" y="300" font-size="12" font-weight="700" fill="#5d666d">37 kept  (145 removed)</text>
<rect x="385" y="200" width="330" height="132" rx="9" fill="#fff4ea" stroke="#d9822b" stroke-width="2.2"/>
<text x="397" y="221" font-size="13" font-weight="700" fill="#1d2328">Screening of the 68 tools named</text>
<text x="397" y="240" font-size="11.5" fill="#1d2328">I1 purpose; E1 to E5; E6 drops general-purpose</text>
<text x="397" y="255" font-size="11.5" fill="#1d2328">platforms (Datadog, Grafana)</text>
<text x="397" y="270" font-size="11.5" fill="#1d2328">Open source: I2 stars and activity (Ragas out)</text>
<text x="397" y="285" font-size="11.5" fill="#1d2328">Closed source: I3 public docs and 2 independent</text>
<text x="397" y="300" font-size="11.5" fill="#1d2328">sources; C1 at least 2 independent sources</text>
<text x="397" y="315" font-size="12" font-weight="700" fill="#d9822b">13 kept  (55 removed)</text>
<path d="M195.0,167 L195.0,200" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M550.0,167 L550.0,200" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="220" y="380" width="660" height="72" rx="9" fill="#ffffff" stroke="#5d666d" stroke-width="1.4"/>
<text x="232" y="401" font-size="13" font-weight="700" fill="#1d2328">Merge the lists (E5: an SDK and its platform count as one tool)</text>
<text x="232" y="420" font-size="11.5" fill="#1d2328">37 from GitHub + 5 found only by Google (LangSmith, Braintrust, Galileo, Weave, OpenTelemetry)</text>
<text x="232" y="435" font-size="12" font-weight="700" fill="#5d666d">42 candidates</text>
<path d="M195.0,317 L195.0,348.5 L385.0,348.5 L385.0,380" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="203" y="342" font-size="11" fill="#5d666d" >37</text>
<path d="M550.0,332 L550.0,356.0 L715.0,356.0 L715.0,380" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="560" y="350" font-size="11" fill="#5d666d" >13 (8 of them also on GitHub)</text>
<path d="M905,152 L905,416 L880,416" fill="none" stroke="#8a8f94" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<rect x="220" y="490" width="660" height="102" rx="9" fill="#ffffff" stroke="#5d666d" stroke-width="1.4"/>
<text x="232" y="511" font-size="13" font-weight="700" fill="#1d2328">S1 scope (decided from the tool&#x27;s own description)</text>
<text x="232" y="530" font-size="11.5" fill="#1d2328">Keep: primary purpose is observability or evaluation of LLM applications or agents.</text>
<text x="232" y="545" font-size="11.5" fill="#1d2328">Out: benchmarks, prompt formats, MCP-only testing, broader suites, end-user applications,</text>
<text x="232" y="560" font-size="11.5" fill="#1d2328">general-purpose observability platforms.</text>
<text x="232" y="575" font-size="12" font-weight="700" fill="#5d666d">31 kept  (11 removed, one borderline treated as out)</text>
<path d="M550.0,452 L550.0,490" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="558.0" y="475.0" font-size="11" fill="#5d666d" >42</text>
<rect x="220" y="610" width="660" height="72" rx="9" fill="#ffffff" stroke="#5d666d" stroke-width="1.4"/>
<text x="232" y="631" font-size="13" font-weight="700" fill="#1d2328">S2 role label (no removal)</text>
<text x="232" y="650" font-size="11.5" fill="#1d2328">standard: telemetry conventions or instrumentation  ·  platform: stores and shows traces, offers evaluation</text>
<text x="232" y="665" font-size="11.5" fill="#1d2328">framework: library or CLI that runs evaluations, no trace backend</text>
<path d="M550.0,592 L550.0,610" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="558.0" y="605.0" font-size="11" fill="#5d666d" >31</text>
<rect x="130" y="720" width="380" height="102" rx="9" fill="#ffffff" stroke="#5d666d" stroke-width="1.4"/>
<text x="142" y="741" font-size="13" font-weight="700" fill="#1d2328">A1 agent relevance</text>
<text x="142" y="760" font-size="11.5" fill="#1d2328">Official docs explicitly cover agents, tool calls or</text>
<text x="142" y="775" font-size="11.5" fill="#1d2328">multi-step traces; the quote is checked against</text>
<text x="142" y="790" font-size="11.5" fill="#1d2328">a saved copy of the page</text>
<text x="142" y="805" font-size="11.5" fill="#1d2328"></text>
<rect x="560" y="720" width="410" height="102" rx="9" fill="#fff4ea" stroke="#d9822b" stroke-width="2.2"/>
<text x="572" y="741" font-size="13" font-weight="700" fill="#1d2328">C1 corroboration  (applies to every tool)</text>
<text x="572" y="760" font-size="11.5" fill="#1d2328">At least 2 independent sources in the Google log;</text>
<text x="572" y="775" font-size="11.5" fill="#1d2328">the tool&#x27;s own website does not count; a competitor&#x27;s</text>
<text x="572" y="790" font-size="11.5" fill="#1d2328">comparison post does count. Added after the first Google run</text>
<text x="572" y="805" font-size="12" font-weight="700" fill="#d9822b">13 pass  /  18 fail</text>
<path d="M550.0,682 L550.0,701.0 L320.0,701.0 L320.0,720" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M510,771.0 L560,771.0" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="330" y="900" width="440" height="57" rx="9" fill="#fff4ea" stroke="#d9822b" stroke-width="2.2"/>
<text x="342" y="921" font-size="13" font-weight="700" fill="#1d2328">S4 ranking (orders only, does not select)</text>
<text x="342" y="940" font-size="11.5" fill="#1d2328">Independent Google sources, then GitHub stars</text>
<path d="M765.0,822 L765.0,861.0 L550.0,861.0 L550.0,900" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="775" y="880" font-size="11" fill="#5d666d" >13</text>
<text x="790" y="925" font-size="11" fill="#5d666d">The 18 that fail are open-source tools</text>
<text x="790" y="939" font-size="11" fill="#5d666d">found through GitHub, for example</text>
<text x="790" y="953" font-size="11" fill="#5d666d">MLflow (0 independent sources),</text>
<text x="790" y="967" font-size="11" fill="#5d666d">Evidently (0), Laminar (0), OpenLIT (0),</text>
<text x="790" y="981" font-size="11" fill="#5d666d">LangWatch (1), AgentOps (1), TruLens (1).</text>
<rect x="190" y="990" width="720" height="72" rx="9" fill="#e9f4ea" stroke="#3c8a4a" stroke-width="1.4"/>
<text x="202" y="1011" font-size="13" font-weight="700" fill="#1d2328">Result: 13 entries</text>
<text x="202" y="1030" font-size="11.5" fill="#1d2328">10 tools: 9 platforms and 1 framework  +  3 standards (OpenTelemetry, OpenLLMetry, OpenInference)</text>
<text x="202" y="1045" font-size="11.5" fill="#1d2328">The paper reports the standards apart from the tools (S2)</text>
<path d="M550.0,957 L550.0,990" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="1130" width="240" height="87" rx="9" fill="#f3eefa" stroke="#6f4fa0" stroke-width="1.4"/>
<text x="42" y="1151" font-size="13" font-weight="700" fill="#1d2328">S3 built-in metrics</text>
<text x="42" y="1170" font-size="11.5" fill="#1d2328">Metrics the tool ships, read from</text>
<text x="42" y="1185" font-size="11.5" fill="#1d2328">official docs: URL, verbatim quote,</text>
<text x="42" y="1200" font-size="11.5" fill="#1d2328">saved page, access date</text>
<rect x="300" y="1130" width="240" height="87" rx="9" fill="#f3eefa" stroke="#6f4fa0" stroke-width="1.4"/>
<text x="312" y="1151" font-size="13" font-weight="700" fill="#1d2328">M1 metric scope</text>
<text x="312" y="1170" font-size="11.5" fill="#1d2328">Keep how a run executes or how good</text>
<text x="312" y="1185" font-size="11.5" fill="#1d2328">its output is. Drop text match, retrieval,</text>
<text x="312" y="1200" font-size="11.5" fill="#1d2328">audio, image, task-specific, custom-only</text>
<rect x="570" y="1130" width="240" height="72" rx="9" fill="#f3eefa" stroke="#6f4fa0" stroke-width="1.4"/>
<text x="582" y="1151" font-size="13" font-weight="700" fill="#1d2328">Result: 231 built-in rows</text>
<text x="582" y="1170" font-size="11.5" fill="#1d2328">193 from the ten tools and</text>
<text x="582" y="1185" font-size="11.5" fill="#1d2328">38 from the three standards</text>
<rect x="840" y="1130" width="240" height="87" rx="9" fill="#f3eefa" stroke="#6f4fa0" stroke-width="1.4"/>
<text x="852" y="1151" font-size="13" font-weight="700" fill="#1d2328">Mapping to unique metrics</text>
<text x="852" y="1170" font-size="11.5" fill="#1d2328">Hand-made, one row per pair:</text>
<text x="852" y="1185" font-size="11.5" fill="#1d2328">45 unique metrics (18 + 27) and 1 that</text>
<text x="852" y="1200" font-size="11.5" fill="#1d2328">only standards document</text>
<path d="M550.0,1062 L550.0,1096.0 L150.0,1096.0 L150.0,1130" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M270,1173.5 L300,1173.5" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M540,1173.5 L570,1166.0" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M810,1166.0 L840,1173.5" fill="none" stroke="#8a8f94" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="1234" width="22" height="12" rx="3" fill="#fff4ea" stroke="#d9822b" stroke-width="2.2"/>
<text x="60" y="1244" font-size="11" fill="#5d666d">depends on Google source counts (I3 for closed-source tools, C1, S4)</text>
<rect x="440" y="1234" width="22" height="12" rx="3" fill="#ffffff" stroke="#5d666d" stroke-width="1.4"/>
<text x="470" y="1244" font-size="11" fill="#5d666d">other rule (I1, I2, E1 to E6, S1, S2, A1, M1)</text></svg>