<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-label="Taxonomy of agent metrics">
<style>
:root{--bg:#fbfaf8;--fg:#1d2328;--muted:#5d666d;--line:#c9c5bc;--panel:#ffffff;--obs:#1f6f8b;--ev:#b4582a}
@media (prefers-color-scheme:dark){:root{--bg:#14181b;--fg:#e8ebec;--muted:#98a1a7;--line:#3a444b;--panel:#1a1f23;--obs:#5cb3d1;--ev:#e08a58}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.mut{fill:var(--muted)}.white{fill:#fff}
.t-Observability{--c:var(--obs)}.t-Evaluation{--c:var(--ev)}
.solid{fill:var(--c)}.tint{fill:var(--c);fill-opacity:.16}.wash{fill:var(--c);fill-opacity:.06}
.card{fill:var(--panel);stroke:var(--c);stroke-width:1.4}.dot{fill:var(--c)}.rule{stroke:var(--c);stroke-opacity:.35;stroke-width:1}
</style>
<rect class="bg" width="1400" height="820"/>
<text x="32" y="40" font-size="22" font-family="Georgia,serif">Taxonomy of agent metrics</text>
<text class="mut" x="32" y="64" font-size="13">46 metrics in 13 categories, in two types: observability metrics are measured from a run, evaluation metrics are judgements of behaviour or output.</text>
<g class="t-Observability"><rect class="wash" x="32.0" y="96" width="652.0" height="680" rx="12"/><rect class="solid" x="32.0" y="96" width="652.0" height="66" rx="12"/><rect class="solid" x="32.0" y="150" width="652.0" height="12"/><text class="white" x="52.0" y="126" font-size="21" font-weight="700">Observability</text><text class="white" x="52.0" y="147" font-size="12.5" fill-opacity=".9">what happened, measured from the run</text><text class="white" x="664.0" y="138" font-size="15" font-weight="600" text-anchor="end">18 metrics</text></g>
<g class="t-Observability"><rect class="card" x="46.0" y="176" width="305.0" height="117" rx="9"/><text x="60.0" y="202" font-size="14" font-weight="700">Tool use</text><text class="mut" x="337.0" y="202" font-size="12" text-anchor="end">3</text><line class="rule" x1="60.0" y1="212" x2="337.0" y2="212"/>
<circle class="dot" cx="64.0" cy="228" r="3.2"/><text x="76.0" y="232" font-size="12.5">Tool execution errors</text>
